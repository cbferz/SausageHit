name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffolding
        run: flutter create --platforms=android --project-name sausage_hit .
      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart
      - name: Force landscape orientation
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          android_ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android_ns)

          tree = ET.parse(path)
          root = tree.getroot()
          application = root.find("application")
          if application is None:
              raise SystemExit("AndroidManifest.xml has no application element")

          activity = application.find("activity")
          if activity is None:
              raise SystemExit("AndroidManifest.xml has no main activity")

          activity.set(f"{{{android_ns}}}screenOrientation", "landscape")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          ET.parse(path)
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sausagehit-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
